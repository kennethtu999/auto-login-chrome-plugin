name: Extension CI

on:
  pull_request:
  push:
    branches: ["**"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - run: npm run validate
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: header-login-manager-package
          path: dist/*.zip
          if-no-files-found: error
